<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Resize to 3000 × 3000</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="banner"></div>
    <main id="app" class="app"></main>
    <!--
      The footer lives here rather than being rendered by ui.ts: state changes
      rebuild #app from scratch, and the logo should not flicker between the
      idle, running and done screens.
    -->
    <footer class="site-footer">
      <img
        class="site-footer__logo"
        src="./src/assets/lloyd-baker-logo.png"
        alt="Lloyd Baker London"
        width="200"
        height="99"
      />
    </footer>
    <div id="modal-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
